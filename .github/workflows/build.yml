name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      # compileSdk 37 is newer than the runner's preinstalled platform list.
      - name: Install SDK platform 37
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dark-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
