name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner image ships the Android SDK and cmdline-tools already;
      # android-actions/setup-android fails on it (it asks for the retired "tools" package).
      # Only the newer platform/build-tools are missing.
      - name: Install SDK platform 37
        run: |
          set -x
          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      # One signing key across runs: without this every runner makes a fresh debug.keystore,
      # a new APK gets a different signature and cannot install over the one already on the phone.
      - name: Keep one debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: android-debug-keystore-v1

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dark-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
